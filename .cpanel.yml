---
deployment:
  tasks:
    - export DEPLOYPATH=/home/cdas/dap/
    - /usr/bin/rsync -a --delete --exclude='.git' --exclude='.env' --exclude='db.sqlite3' --exclude='media/' --exclude='staticfiles/' --exclude='tmp/' --exclude='Passengerfile.json' --exclude='restart.txt' --exclude='.venv/' --exclude='.venv_run/' --exclude='venv/' --exclude='__pycache__/' --exclude='__MACOSX/' ./ $DEPLOYPATH
    - source /home/cdas/virtualenv/dap/3.9/bin/activate && cd $DEPLOYPATH && python manage.py collectstatic --noinput
    - source /home/cdas/virtualenv/dap/3.9/bin/activate && cd $DEPLOYPATH && python manage.py migrate --noinput
    - mkdir -p $DEPLOYPATH/tmp && touch $DEPLOYPATH/tmp/restart.txt
