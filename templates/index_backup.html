{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>


/* NEW HERO SECTION STYLES */

/* Hero Section Base */
.hero-section {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
}

/* Background Styles */
.hero-background {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
}

.hero-bg-image {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('{% static "assets/images/main-banner.jpg" %}') no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, 
        rgba(20, 130, 85, 0.9) 0%, 
        rgba(0, 0, 0, 0.7) 50%, 
        rgba(20, 130, 85, 0.8) 100%);
}

/* Animated Shapes */
.hero-shapes {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
}

.shape {
    position: absolute;
    border: 2px solid rgba(255, 255, 255, 0.1);
    animation: float 6s ease-in-out infinite;
}

.shape-1 {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    top: 20%;
    left: 10%;
    animation-delay: 0s;
}

.shape-2 {
    width: 120px;
    height: 120px;
    top: 30%;
    right: 15%;
    animation-delay: 2s;
}

.shape-3 {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    bottom: 25%;
    left: 20%;
    animation-delay: 4s;
}

.shape-4 {
    width: 100px;
    height: 100px;
    bottom: 35%;
    right: 25%;
    animation-delay: 6s;
}

/* Floating Particles */
.hero-particles {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    animation: float 8s ease-in-out infinite;
}

.p1 {
    width: 4px;
    height: 4px;
    top: 25%;
    left: 20%;
    animation-delay: 0s;
}

.p2 {
    width: 6px;
    height: 6px;
    top: 45%;
    right: 25%;
    animation-delay: 2s;
}

.p3 {
    width: 3px;
    height: 3px;
    bottom: 30%;
    left: 35%;
    animation-delay: 4s;
}

.p4 {
    width: 5px;
    height: 5px;
    bottom: 40%;
    right: 35%;
    animation-delay: 6s;
}

.p5 {
    width: 4px;
    height: 4px;
    top: 60%;
    left: 50%;
    animation-delay: 8s;
}

/* Main Content */
.hero-content {
    position: relative;
    z-index: 3;
    width: 100%;
    padding: 80px 0;
}

.hero-inner {
    text-align: center;
    max-width: 900px;
    margin: 0 auto;
}

/* Welcome Badge */
.hero-badge {
    display: inline-flex;
    align-items: center;
    background: linear-gradient(45deg, rgba(20, 130, 85, 0.9), rgba(55, 127, 75, 0.9));
    color: white;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(20, 130, 85, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    animation: pulse 3s ease-in-out infinite;
}

.hero-badge i {
    margin-right: 10px;
    animation: spin 3s linear infinite;
}

/* Main Title */
.hero-title {
    margin-bottom: 30px;
    line-height: 1.1;
}

.title-line {
    display: block;
    font-size: 72px;
    font-weight: 900;
    margin-bottom: 10px;
    opacity: 1 !important;
    visibility: visible !important;
    position: relative;
    transition: all 0.3s ease;
    animation: none !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Engineering - Primary Brand Color */
.title-engineering {
    background: linear-gradient(45deg, 
        #ffffff, #148255, #ffffff, #377f4b, #ffffff,
        #20c997, #148255, #377f4b, #20c997, #ffffff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: brandShimmer 4s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(20, 130, 85, 0.6);
    position: relative;
    overflow: hidden;
}

.title-engineering::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    animation: shine 3s ease-in-out infinite;
}

/* Consultancy - Secondary Brand Color */
.title-consultancy {
    background: linear-gradient(45deg, 
        #ffffff, #377f4b, #ffffff, #148255, #ffffff,
        #20c997, #377f4b, #148255, #20c997, #ffffff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: brandShimmer 4s ease-in-out infinite 1s;
    text-shadow: 0 0 40px rgba(55, 127, 75, 0.6);
    position: relative;
    overflow: hidden;
}

.title-consultancy::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    animation: shine 3s ease-in-out infinite 1.5s;
}

/* Excellence - Accent Brand Color */
.title-excellence {
    background: linear-gradient(45deg, 
        #ffffff, #20c997, #ffffff, #148255, #ffffff,
        #377f4b, #20c997, #148255, #377f4b, #ffffff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: brandShimmer 4s ease-in-out infinite 2s;
    text-shadow: 0 0 40px rgba(32, 201, 151, 0.6);
    position: relative;
    overflow: hidden;
}

.title-excellence::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    animation: shine 3s ease-in-out infinite 2.5s;
}

/* Hover effects */
.title-engineering:hover {
    transform: scale(1.08);
    text-shadow: 0 0 60px rgba(20, 130, 85, 0.9);
    animation: brandShimmer 2s ease-in-out infinite;
}

.title-consultancy:hover {
    transform: scale(1.08);
    text-shadow: 0 0 60px rgba(55, 127, 75, 0.9);
    animation: brandShimmer 2s ease-in-out infinite;
}

.title-excellence:hover {
    transform: scale(1.08);
    text-shadow: 0 0 60px rgba(32, 201, 151, 0.9);
    animation: brandShimmer 2s ease-in-out infinite;
}

/* Subtitle */
.hero-subtitle {
    color: white;
    font-size: 24px;
    margin-bottom: 50px;
    opacity: 0.95;
    font-weight: 300;
    line-height: 1.6;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
}

/* Buttons */
.hero-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 60px;
    flex-wrap: wrap;
}

.btn {
    position: relative;
    padding: 18px 36px;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 700;
    font-size: 16px;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    border: none;
    cursor: pointer;
}

.btn-primary {
    background: linear-gradient(45deg, #148255, #377f4b);
    color: white;
    box-shadow: 0 15px 35px rgba(20, 130, 85, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.2);
}

.btn-primary:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(20, 130, 85, 0.6);
}

.btn-secondary {
    background: transparent;
    color: white;
    border: 3px solid rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-5px);
}

.btn-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
}

.btn-primary:hover .btn-shine {
    left: 100%;
}

/* Scroll Indicator */
.scroll-indicator {
    text-align: center;
    color: white;
    opacity: 0.8;
}

.scroll-text {
    font-size: 14px;
    margin-bottom: 15px;
    font-weight: 500;
}

.scroll-arrow {
    animation: bounce 2s ease-in-out infinite;
}

.scroll-arrow i {
    font-size: 20px;
}

/* Animation Keyframes */
@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideInUp {
    0% {
        opacity: 0;
        transform: translateY(50px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0px) rotate(0deg);
    }
    25% {
        transform: translateY(-15px) rotate(2deg);
    }
    50% {
        transform: translateY(-25px) rotate(0deg);
    }
    75% {
        transform: translateY(-15px) rotate(-2deg);
    }
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
    }
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

@keyframes brandShimmer {
    0% {
        background-position: 0% 50%;
        filter: brightness(1) saturate(1);
    }
    25% {
        background-position: 100% 50%;
        filter: brightness(1.1) saturate(1.2);
    }
    50% {
        background-position: 100% 100%;
        filter: brightness(1.2) saturate(1.3);
    }
    75% {
        background-position: 0% 100%;
        filter: brightness(1.1) saturate(1.2);
    }
    100% {
        background-position: 0% 50%;
        filter: brightness(1) saturate(1);
    }
}

@keyframes shine {
    0% {
        left: -100%;
    }
    50% {
        left: 100%;
    }
    100% {
        left: 100%;
    }
}

@keyframes shimmer {
    0% {
        background-position: -200% center;
    }
    100% {
        background-position: 200% center;
    }
}

@keyframes bounce {
    0%, 20%, 53%, 80%, 100% {
        transform: translateY(0);
    }
    40%, 43% {
        transform: translateY(-10px);
    }
    70% {
        transform: translateY(-5px);
    }
    90% {
        transform: translateY(-2px);
    }
}

/* Animation Classes */
.animate-fade-in-up {
    opacity: 1 !important;
    animation: none !important;
    visibility: visible !important;
}

.animate-fade-in-up:nth-child(1) { animation-delay: 0s !important; }
.animate-fade-in-up:nth-child(2) { animation-delay: 0s !important; }
.animate-fade-in-up:nth-child(3) { animation-delay: 0s !important; }
.animate-fade-in-up:nth-child(4) { animation-delay: 0s !important; }
.animate-fade-in-up:nth-child(5) { animation-delay: 0s !important; }

/* Ensure content stays visible after animation */
.hero-badge,
.hero-title,
.hero-subtitle,
.hero-buttons,
.scroll-indicator {
    opacity: 1 !important;
    visibility: visible !important;
}

/* Fallback for animation issues */
.hero-inner > * {
    opacity: 1 !important;
    visibility: visible !important;
}

/* Ensure animations complete properly */
.animate-fade-in-up {
    animation-fill-mode: forwards !important;
}

.title-line {
    animation-fill-mode: forwards !important;
}

/* RESPONSIVE STYLES FOR ALL SCREEN SIZES */

/* Large Desktop (1400px+) */
@media (min-width: 1400px) {
    .hero-section {
        min-height: 100vh;
    }
    
    .title-line {
        font-size: 70px;
    }
    
    .hero-subtitle {
        font-size: 26px;
    }
    
    .btn {
        padding: 20px 40px;
        font-size: 18px;
    }
}

/* Desktop (1200px - 1399px) */
@media (max-width: 1399px) and (min-width: 1200px) {
    .title-line {
        font-size: 60px;
    }
    
    .hero-subtitle {
        font-size: 24px;
    }
    
    .btn {
        padding: 18px 36px;
        font-size: 16px;
    }
}

/* Large Laptop (992px - 1199px) */
@media (max-width: 1199px) and (min-width: 992px) {
    .hero-content {
        padding: 60px 0;
    }
    
    .title-line {
        font-size: 50px;
    }
    
    .hero-subtitle {
        font-size: 22px;
        margin-bottom: 40px;
    }
    
    .hero-buttons {
        margin-bottom: 50px;
    }
    
    .btn {
        padding: 16px 32px;
        font-size: 15px;
    }
}

/* Tablet (768px - 991px) */
@media (max-width: 991px) and (min-width: 768px) {
    .hero-section {
        min-height: 90vh;
    }
    
    .hero-content {
        padding: 50px 0;
    }
    
    .title-line {
        font-size: 42px;
        margin-bottom: 8px;
    }
    
    .hero-subtitle {
        font-size: 20px;
        margin-bottom: 35px;
    }
    
    .hero-badge {
        font-size: 14px;
        padding: 10px 20px;
        margin-bottom: 25px;
    }
    
    .hero-buttons {
        margin-bottom: 40px;
        gap: 15px;
    }
    
    .btn {
        padding: 14px 28px;
        font-size: 14px;
    }
    
    /* Reduce animations on tablets */
    .shape {
        display: none;
    }
    
    .particle:nth-child(n+3) {
        display: none;
    }
}

/* Mobile Large (576px - 767px) */
@media (max-width: 767px) and (min-width: 576px) {
    .hero-section {
        min-height: 80vh;
    }
    
    .hero-content {
        padding: 40px 0;
    }
    
    .title-line {
        font-size: 32px;
        margin-bottom: 6px;
    }
    
    .hero-subtitle {
        font-size: 18px;
        margin-bottom: 30px;
        padding: 0 20px;
    }
    
    .hero-badge {
        font-size: 13px;
        padding: 8px 16px;
        margin-bottom: 20px;
    }
    
    .hero-buttons {
        margin-bottom: 35px;
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }
    
    .btn {
        padding: 12px 24px;
        font-size: 14px;
        width: 100%;
        max-width: 280px;
        justify-content: center;
    }
    
    /* Hide animations on mobile for performance */
    .shape,
    .particle {
        display: none;
    }
    
    /* Disable complex animations */
    .hero-bg-image {
        background-attachment: scroll;
    }
    
    .title-line.highlight {
        animation: slideInUp 1s ease-out forwards;
    }
}

/* Mobile Medium (480px - 575px) */
@media (max-width: 575px) and (min-width: 480px) {
    .hero-section {
        min-height: 70vh;
    }
    
    .hero-content {
        padding: 30px 0;
    }
    
    .title-line {
        font-size: 32px;
        margin-bottom: 5px;
    }
    
    .hero-subtitle {
        font-size: 16px;
        margin-bottom: 25px;
        padding: 0 15px;
    }
    
    .hero-badge {
        font-size: 12px;
        padding: 6px 12px;
        margin-bottom: 15px;
    }
    
    .hero-buttons {
        margin-bottom: 30px;
        gap: 10px;
    }
    
    .btn {
        padding: 10px 20px;
        font-size: 13px;
        max-width: 250px;
    }
    
    .scroll-indicator {
        margin-top: 20px;
    }
}

/* Mobile Small (360px - 479px) */
@media (max-width: 479px) and (min-width: 360px) {
    .hero-section {
        min-height: 60vh;
    }
    
    .hero-content {
        padding: 25px 0;
    }
    
    .title-line {
        font-size: 28px;
        margin-bottom: 4px;
    }
    
    .hero-subtitle {
        font-size: 14px;
        margin-bottom: 20px;
        padding: 0 10px;
    }
    
    .hero-badge {
        font-size: 11px;
        padding: 5px 10px;
        margin-bottom: 12px;
    }
    
    .hero-buttons {
        margin-bottom: 25px;
        gap: 8px;
    }
    
    .btn {
        padding: 8px 16px;
        font-size: 12px;
        max-width: 220px;
    }
    
    .scroll-text {
        font-size: 12px;
    }
    
    .scroll-arrow i {
        font-size: 16px;
    }
}

/* Mobile Extra Small (320px - 359px) */
@media (max-width: 359px) {
    .hero-section {
        min-height: 50vh;
    }
    
    .hero-content {
        padding: 20px 0;
    }
    
    .title-line {
        font-size: 24px;
        margin-bottom: 3px;
    }
    
    .hero-subtitle {
        font-size: 13px;
        margin-bottom: 15px;
        padding: 0 8px;
    }
    
    .hero-badge {
        font-size: 10px;
        padding: 4px 8px;
        margin-bottom: 10px;
    }
    
    .hero-buttons {
        margin-bottom: 20px;
        gap: 6px;
    }
    
    .btn {
        padding: 6px 12px;
        font-size: 11px;
        max-width: 200px;
    }
    
    .scroll-text {
        font-size: 11px;
    }
    
    .scroll-arrow i {
        font-size: 14px;
    }
}

/* Landscape Orientation Adjustments */
@media (max-width: 767px) and (orientation: landscape) {
    .hero-section {
        min-height: 60vh;
    }
    
    .hero-content {
        padding: 20px 0;
    }
    
    .title-line {
        font-size: 28px;
        margin-bottom: 3px;
    }
    
    .hero-subtitle {
        font-size: 14px;
        margin-bottom: 15px;
    }
    
    .hero-buttons {
        margin-bottom: 20px;
    }
    
    .scroll-indicator {
        display: none;
    }
}

/* High DPI Displays */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    .hero-bg-image {
        background-image: url('{% static "assets/images/main-banner.jpg" %}');
    }
}

/* Reduced Motion Preferences */
@media (prefers-reduced-motion: reduce) {
    .shape,
    .particle,
    .hero-badge,
    .title-line,
    .scroll-arrow {
        animation: none !important;
    }
    
    .title-line {
        opacity: 1 !important;
    }
}



/* General Animation Classes */
.animate-fade-in-up {
    animation: fadeInUp 0.8s ease-out;
}

.animate-fade-in-left {
    animation: fadeInLeft 0.8s ease-out;
}

.animate-fade-in-right {
    animation: fadeInRight 0.8s ease-out;
}

.animate-slide-in-up {
    animation: slideInUp 0.8s ease-out;
}

.animate-scale-in {
    animation: scaleIn 0.6s ease-out;
}

.animate-float {
    animation: float 3s ease-in-out infinite;
}

.animate-pulse {
    animation: pulse 2s ease-in-out infinite;
}

/* Scroll-triggered animations */
.scroll-animate {
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.8s ease-out;
}

.scroll-animate.animate {
    opacity: 1;
    transform: translateY(0);
}

.scroll-animate-left {
    opacity: 0;
    transform: translateX(-50px);
    transition: all 0.8s ease-out;
}

.scroll-animate-left.animate {
    opacity: 1;
    transform: translateX(0);
}

.scroll-animate-right {
    opacity: 0;
    transform: translateX(50px);
    transition: all 0.8s ease-out;
}

.scroll-animate-right.animate {
    opacity: 1;
    transform: translateX(0);
}

.scroll-animate-scale {
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.6s ease-out;
}

.scroll-animate-scale.animate {
    opacity: 1;
    transform: scale(1);
}

/* AMAZING ACHIEVEMENTS SECTION - NEW ANIMATIONS */

/* Scroll Reveal Animation */
.scroll-reveal {
    transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.scroll-reveal.revealed {
    transform: translateY(0) !important;
    opacity: 1 !important;
}

/* New Particle Animation */
@keyframes floatParticle {
    0%, 100% {
        transform: translateY(0px) translateX(0px);
        opacity: 0.6;
    }
    25% {
        transform: translateY(-20px) translateX(10px);
        opacity: 1;
    }
    50% {
        transform: translateY(-40px) translateX(-5px);
        opacity: 0.8;
    }
    75% {
        transform: translateY(-20px) translateX(-15px);
        opacity: 1;
    }
}

/* Rotating Shape Animation */
@keyframes rotateShape {
    0% {
        transform: rotate(0deg) scale(1);
    }
    50% {
        transform: rotate(180deg) scale(1.1);
    }
    100% {
        transform: rotate(360deg) scale(1);
    }
}

/* Rotating Border Animation for Achievement Cards */
@keyframes borderRotate {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
}

/* Enhanced Achievement Card Hover Effects */
.achievement-card:hover {
    transform: translateY(-10px) scale(1.02) !important;
    box-shadow: 0 20px 40px rgba(20, 130, 85, 0.25), 0 0 0 1px rgba(20, 130, 85, 0.15);
}

.achievement-card:hover .icon-bg {
    transform: scale(1.1);
    box-shadow: 0 12px 35px rgba(20, 130, 85, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
}

.achievement-card:hover .achievement-number {
    transform: scale(1.05);
}

.achievement-card:hover > div:first-child {
    opacity: 1;
}

.achievement-card:hover > div:last-child {
    opacity: 1;
}

    display: inline-flex;
    align-items: center;
    background: linear-gradient(45deg, rgba(20, 130, 85, 0.1), rgba(55, 127, 75, 0.1));
    color: #148255;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 30px;
    border: 1px solid rgba(20, 130, 85, 0.2);
}

/* Service Title */
.service-title {
    font-size: 48px;
    font-weight: 900;
    margin-bottom: 25px;
    background: linear-gradient(135deg, #148255, #377f4b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* Service Subtitle */
.service-subtitle {
    font-size: 20px;
    color: #666;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.6;
}

/* Service Cards */
.service-card {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    transition: all 0.4s ease;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: 1px solid rgba(20, 130, 85, 0.1);
    overflow: hidden;
}

.service-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(20, 130, 85, 0.15);
    border-color: rgba(20, 130, 85, 0.3);
}

/* Card Background Pattern */
.service-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(20, 130, 85, 0.03) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
}

.service-card:hover::before {
    opacity: 1;
}

/* Service Icon */
.service-icon {
    position: relative;
    margin-bottom: 30px;
}

.icon-bg {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #148255 0%, #377f4b 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    position: relative;
    box-shadow: 0 10px 25px rgba(20, 130, 85, 0.3), inset 0 2px 4px rgba(255,255,255,0.2);
    transition: all 0.4s ease;
}

.service-card:hover .icon-bg {
    transform: scale(1.1);
    box-shadow: 0 15px 35px rgba(20, 130, 85, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
}

.icon-bg:after {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    border: 2px solid rgba(20, 130, 85, 0.15);
    border-radius: 50%;
    transition: all 0.4s ease;
}

.service-card:hover .icon-bg:after {
    border-color: rgba(20, 130, 85, 0.3);
    transform: translateX(-50%) scale(1.1);
}

/* Service Name */
.service-name {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
    color: #148255;
    transition: all 0.4s ease;
}

.service-card:hover .service-name {
    color: #377f4b;
}

/* Service Description */
.service-description {
    font-size: 15px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 25px;
    font-weight: 400;
}

/* Service Features */
.service-features {
    margin-bottom: 30px;
}

.service-features div {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
    color: #555;
    transition: all 0.3s ease;
}

.service-card:hover .service-features div {
    color: #333;
}

.service-features i {
    color: #148255;
    margin-right: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.service-card:hover .service-features i {
    transform: scale(1.1);
}

/* CTA Button */
.service-btn {
    background: linear-gradient(135deg, #148255, #377f4b);
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 25px;
    font-weight: 600;
    display: inline-block;
    transition: all 0.4s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
}

.service-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
}

.service-card:hover .service-btn::before {
    left: 100%;
}

.service-btn:hover {
    background: linear-gradient(135deg, #377f4b, #20c997);
    border-color: white;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(20, 130, 85, 0.3);
}

.service-btn i {
    transition: all 0.4s ease;
}

.service-card:hover .service-btn i {
    transform: translateX(5px);
}

/* Hover Effect */
.service-card:hover .service-card::after {
    opacity: 1;
}

/* View All Services Button */
.view-all-btn {
    background: transparent;
    color: #148255;
    padding: 18px 35px;
    text-decoration: none;
    border: 2px solid #148255;
    border-radius: 50px;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.4s ease;
    display: inline-block;
    position: relative;
    overflow: hidden;
}

.view-all-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: #148255;
    transition: left 0.4s ease;
    z-index: -1;
}

.view-all-btn:hover::before {
    left: 0;
}

.view-all-btn:hover {
    background: #148255;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(20, 130, 85, 0.3);
}

.view-all-btn i {
    transition: all 0.4s ease;
}

.view-all-btn:hover i {
    transform: translateX(5px);
}

    .service-title {
        font-size: 42px;
    }
    
    .service-card {
        padding: 35px 25px;
    }

    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
    color: #148255;
    transition: all 0.4s ease;
}

.service-card:hover .service-name {
    color: #377f4b;
}

/* Service Description */
.service-description {
    font-size: 15px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 25px;
    font-weight: 400;
}

/* Service Features */
.service-features {
    margin-bottom: 30px;
}

.service-features div {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
    color: #555;
    transition: all 0.3s ease;
}

.service-card:hover .service-features div {
    color: #333;
}

.service-features i {
    color: #148255;
    margin-right: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.service-card:hover .service-features i {
    transform: scale(1.1);
}

/* CTA Button */
.service-btn {
    background: linear-gradient(135deg, #148255, #377f4b);
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 25px;
    font-weight: 600;
    display: inline-block;
    transition: all 0.4s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
}

.service-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
}

.service-card:hover .service-btn::before {
    left: 100%;
}

.service-btn:hover {
    background: linear-gradient(135deg, #377f4b, #20c997);
    border-color: white;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(20, 130, 85, 0.3);
}

.service-btn i {
    transition: all 0.4s ease;
}

.service-card:hover .service-btn i {
    transform: translateX(5px);
}

/* Hover Effect */
.service-card:hover .service-card::after {
    opacity: 1;
}

/* View All Services Button */
.view-all-btn {
    background: transparent;
    color: #148255;
    padding: 18px 35px;
    text-decoration: none;
    border: 2px solid #148255;
    border-radius: 50px;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.4s ease;
    display: inline-block;
    position: relative;
    overflow: hidden;
}

.view-all-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: #148255;
    transition: left 0.4s ease;
    z-index: -1;
}

.view-all-btn:hover::before {
    left: 0;
}

.view-all-btn:hover {
    background: #148255;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(20, 130, 85, 0.3);
}

.view-all-btn i {
    transition: all 0.4s ease;
}

.view-all-btn:hover i {
    transform: translateX(5px);
}

    animation: fadeInUp 1s ease-out forwards;
}

/* Counter animation */
.counter-animate {
    transition: all 0.3s ease;
}

/* Floating elements */
.floating-element {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    animation: float 6s ease-in-out infinite;
}

.floating-element:nth-child(1) {
    width: 80px;
    height: 80px;
    top: 20%;
    left: 10%;
    animation-delay: 0s;
}

.floating-element:nth-child(2) {
    width: 120px;
    height: 120px;
    top: 60%;
    right: 15%;
    animation-delay: 2s;
}

.floating-element:nth-child(3) {
    width: 60px;
    height: 60px;
    bottom: 20%;
    left: 20%;
    animation-delay: 4s;
}





.service-image-1 {
    background: url('{% static "assets/images/future-img/construction.jpeg" %}') no-repeat center center;
}

.service-image-2 {
    background: url('{% static "assets/images/future-img/construction2.jpeg" %}') no-repeat center center;
}

.service-image-3 {
    background: url('{% static "assets/images/future-img/construction3.jpeg" %}') no-repeat center center;
}

/* Services Section */
.core-services-section {
    padding: 120px 0;
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    position: relative;
    overflow: hidden;
}

/* Background Elements */
.core-services-background {
    position: absolute;
    top: -30%;
    right: -20%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(20, 130, 85, 0.03) 0%, transparent 70%);
    border-radius: 50%;
}

.core-services-background:after {
    content: '';
    position: absolute;
    bottom: -20%;
    left: -15%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(55, 127, 75, 0.02) 0%, transparent 70%);
    border-radius: 50%;
}

/* Service Badge */
.service-badge {
    display: inline-flex;
    align-items: center;
    background: linear-gradient(45deg, rgba(20, 130, 85, 0.1), rgba(55, 127, 75, 0.1));
    color: #148255;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 30px;
    border: 1px solid rgba(20, 130, 85, 0.2);
}

/* Service Title */
.service-title {
    font-size: 48px;
    font-weight: 900;
    margin-bottom: 25px;
    background: linear-gradient(135deg, #148255, #377f4b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* Service Subtitle */
.service-subtitle {
    font-size: 20px;
    color: #666;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.6;
}

/* Service Cards */
.service-card {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    transition: all 0.4s ease;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: 1px solid rgba(20, 130, 85, 0.1);
    overflow: hidden;
}

.service-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(20, 130, 85, 0.15);
    border-color: rgba(20, 130, 85, 0.3);
}

/* Card Background Pattern */
.service-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(20, 130, 85, 0.03) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
}

.service-card:hover::before {
    opacity: 1;
}

/* Service Icon */
.service-icon {
    position: relative;
    margin-bottom: 30px;
}

.icon-bg {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #148255 0%, #377f4b 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    position: relative;
    box-shadow: 0 10px 25px rgba(20, 130, 85, 0.3), inset 0 2px 4px rgba(255,255,255,0.2);
    transition: all 0.4s ease;
}

.service-card:hover .icon-bg {

}
